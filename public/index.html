<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Inventory Management System</title>
  <!-- Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">

      <!-- Beach decorations (purely visual, aria-hidden) -->
      <div class="login-sun" aria-hidden="true"></div>
      <div class="login-sun-reflection" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>

      <!-- Scrolling waves at bottom of hero -->
      <svg class="login-waves" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 1440 80" preserveAspectRatio="none" style="height:80px;">
        <path fill="rgba(59,26,107,.55)"
          d="M0,40 C180,80 360,0 540,40 C720,80 900,0 1080,40 C1260,80 1440,0 1440,40
             L1440,80 L0,80 Z"/>
        <path fill="rgba(30,17,71,.8)" style="animation-delay:.5s"
          d="M0,55 C200,10 400,70 600,50 C800,30 1000,70 1200,50 C1300,40 1380,60 1440,55
             L1440,80 L0,80 Z"/>
      </svg>

      <div class="login-box">
        <div class="login-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="#5B2A86"/>
            <path d="M12 16h24M12 24h24M12 32h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 id="login-box-title">Inventory <span class="headline-grad">Management</span></h1>
        <p class="login-subtitle">Department Item Issue &amp; Tracking System</p>
        <!-- Login Form -->
        <div id="login-panel">
          <form id="login-form">
            <div class="form-group">
              <label>Username</label>
              <input type="text" id="login-username" placeholder="Enter username" required autocomplete="username">
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            <div id="login-error" class="error-msg hidden"></div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
          </form>
          <p style="text-align:center;margin-top:16px;font-size:13px;color:rgba(255,255,255,.65);">
            New student? <a href="#" id="show-register-btn" style="color:var(--gold);font-weight:700;">Register here</a>
          </p>
          <div class="demo-creds">
            <p><strong>Demo Credentials</strong></p>
            <div class="cred-row"><span class="badge badge-purple">Coordinator</span> coordinator / coord123</div>
            <div class="cred-row"><span class="badge badge-blue">Student</span> student001 / student123</div>
          </div>
        </div>

        <!-- Register Form -->
        <div id="register-panel" style="display:none;">
          <form id="register-form">
            <div class="form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px;">
              <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" placeholder="e.g. Rahul Verma" required>
              </div>
              <div class="form-group">
                <label>Enrolment Number *</label>
                <input type="text" name="enrolment_number" placeholder="e.g. MSDFIS2024004" required>
              </div>
              <div class="form-group">
                <label>Programme *</label>
                <select name="programme" id="reg-programme-sel" required style="width:100%;padding:9px 12px;border:1px solid rgba(91,42,134,.22);border-radius:14px;font-size:13.5px;background:rgba(255,255,255,.74);color:#2A1245;">
                  <option value="">Select programme…</option>
                </select>
              </div>
              <div class="form-group">
                <label>Semester *</label>
                <input type="number" name="semester" min="1" max="8" placeholder="1" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your@email.com">
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" placeholder="10-digit number">
              </div>
              <div class="form-group">
                <label>Username *</label>
                <input type="text" name="username" placeholder="choose a username" required>
              </div>
              <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" placeholder="choose a password" required>
              </div>
            </div>
            <div id="register-error" class="error-msg hidden"></div>
            <div id="register-success" class="hidden" style="padding:10px 14px;background:rgba(16,185,129,.14);color:var(--success);border:1px solid rgba(16,185,129,.28);border-radius:14px;font-size:13px;margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
          </form>
          <p style="text-align:center;margin-top:16px;font-size:13px;color:rgba(255,255,255,.65);">
            Already have an account? <a href="#" id="show-login-btn" style="color:var(--gold);font-weight:700;">Sign in</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="screen hidden">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="10" fill="#5B2A86"/>
            <path d="M12 16h24M12 24h24M12 32h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span>Inventory</span>
        </div>
        <nav id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <div id="user-info"></div>
          <button id="logout-btn" class="btn btn-ghost btn-sm">Sign Out</button>
        </div>
      </aside>

      <!-- Main Content -->
      <main id="main-content">
        <div id="page-container"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/inventory.js"></script>
  <script src="/js/pages/students.js"></script>
  <script src="/js/pages/issues.js"></script>
  <script src="/js/pages/returns.js"></script>
  <script src="/js/pages/renewals.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/pages/programmes.js"></script>
  <script src="/js/pages/student-portal.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
